name: Bug report
description: Something in the SDK doesn't work as its docs say.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never paste tokens, keys or customer data here: the SallaPush log codes are enough.
        Security problems don't belong in an issue: report them privately, as this repository's security policy (the Security tab) explains.
        Contact the Salla team for your app id.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: The SallaPush SDK version you use, such as 1.1.0.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      description: Such as iOS 18.6 on an iPhone 15.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you installed the SDK
      options:
        - Swift Package Manager
        - CocoaPods
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: Tools and frameworks
      description: Your Xcode and Swift versions, and the other push SDKs in your app.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps that show the problem. A small sample project helps most.
  - type: textarea
    id: log-codes
    attributes:
      label: SallaPush log codes
      description: Set the SallaPush log level to verbose, reproduce the problem, and paste the SallaPush lines, such as register.ok or login.rejected. Remove ids and tokens first.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, and this problem isn't reported yet.
          required: true
        - label: This report holds no tokens, keys or customer data.
          required: true
